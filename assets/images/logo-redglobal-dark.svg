<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="corpBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
  </defs>

  <!-- Constellation Nodes & Connecting Rods -->
  <g id="constellation" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
    <!-- Lines from center (400, 160) -->
    <line x1="400" y1="160" x2="330" y2="55" />
    <line x1="400" y1="160" x2="455" y2="85" />
    <line x1="400" y1="160" x2="540" y2="160" stroke-width="7" />
    <line x1="400" y1="160" x2="465" y2="245" />
    <line x1="400" y1="160" x2="340" y2="235" />
    <line x1="400" y1="160" x2="260" y2="160" />

    <!-- Circles -->
    <!-- Top-left node -->
    <circle cx="330" cy="55" r="18" fill="#FFFFFF" stroke="none" />
    <!-- Top-right node -->
    <circle cx="455" cy="85" r="12" fill="#FFFFFF" stroke="none" />
    <!-- Right node -->
    <circle cx="540" cy="160" r="26" fill="#FFFFFF" stroke="none" />
    <!-- Bottom-right node -->
    <circle cx="465" cy="245" r="20" fill="#FFFFFF" stroke="none" />
    <!-- Bottom-left node -->
    <circle cx="340" cy="235" r="22" fill="#FFFFFF" stroke="none" />
    <!-- Far-left node -->
    <circle cx="260" cy="160" r="15" fill="#FFFFFF" stroke="none" />

    <!-- Center Hub -->
    <circle cx="400" cy="160" r="38" fill="#FFFFFF" stroke="none" />
    <circle cx="400" cy="160" r="32" fill="#0A0F24" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="400" cy="160" r="18" fill="#3B82F6" stroke="none" />
  </g>

  <!-- Typography: Red Global Consultorías -->
  <text x="400" y="375" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Montserrat', 'Century Gothic', sans-serif" font-size="52" font-weight="400" fill="#FFFFFF" letter-spacing="-0.5">
    Red Global Consultorías
  </text>

  <!-- Typography: Mundo Mejor -->
  <text x="400" y="435" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="28" font-weight="300" fill="#94A3B8" letter-spacing="8">
    MUNDO MEJOR
  </text>
</svg>